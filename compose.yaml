services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure the runtime PostgreSQL URL securely}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Configure the HTTPS authentication origin}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Configure a runtime signing secret}
      DEVELOPMENT_MODE: "false"
      POLICIES_APPROVED: ${POLICIES_APPROVED:-false}
      POLICY_VERSION: ${POLICY_VERSION:-}
      EVENT_REGISTRATIONS_ENABLED: ${EVENT_REGISTRATIONS_ENABLED:-false}
      MEMBERSHIP_APPLICATIONS_ENABLED: ${MEMBERSHIP_APPLICATIONS_ENABLED:-false}
      CONTACT_SUBMISSIONS_ENABLED: ${CONTACT_SUBMISSIONS_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_URL: ${APP_URL:-}
      SITE_INDEXING_ENABLED: ${SITE_INDEXING_ENABLED:-false}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
